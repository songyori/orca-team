# orca-team 설정. orch 가 디스패치·리뷰 때 읽는다.
# 모델 우선순위: orch start/fix --model·--effort > 태스크 front matter(claude_model 등) > [roles.<직무>] > [defaults]
# Claude 모델: fable | opus | sonnet | haiku (또는 전체 모델 ID). effort: low | medium | high | xhigh | max
# Codex 모델: gpt-6-astra | gpt-6.1-sol | gpt-6-luna. effort: low | medium | high | xhigh
# owns: 직무가 수정·커밋할 수 있는 경로(glob). 진행 중 태스크끼리 겹치면 orch start 가 거부한다.
# max_parallel: orch start-ready 가 동시에 띄워 두는 working 태스크 수 상한.
# user_approval_roles: Codex APPROVE 뒤 orch accept 해도 done 이 아니라 awaiting_user(사용자 일괄 승인 대기)가 되는 직무.
#   [roles] 에 있는 직무만 쓴다. 키가 없으면 [](승인 게이트 없음, 0.2.0 흐름).
# director: 디자인 방향(레퍼런스·톤 시안·디자인 시스템). 이 직무가 있으면 orch plan check 가 designer 태스크에 director 선행을 요구한다.
# auto_up: 메인 세션 훅이 코디네이터가 확실히 죽은 것을 보면 자동으로 다시 띄운다(기본 true). false 면 안내만 한다.

max_parallel = 4
user_approval_roles = ["designer"]

[coordinator]
model = "opus"
effort = "xhigh"
auto_up = true

[review]
max_rounds = 3

[defaults]
claude_model = "sonnet"
claude_effort = "xhigh"
codex_model = "gpt-6.1-sol"
codex_effort = "high"

[roles.planner]
title = "기획"
claude_model = "opus"
claude_effort = "xhigh"
codex_model = "gpt-6.1-sol"
codex_effort = "high"
owns = ["docs/planning/**"]

[roles.director]
title = "디자인 디렉터"
claude_model = "opus"
claude_effort = "xhigh"
codex_model = "gpt-6.1-sol"
codex_effort = "high"
owns = ["docs/design/**", "assets/**"]

[roles.designer]
title = "디자인"
claude_model = "sonnet"
claude_effort = "xhigh"
codex_model = "gpt-6.1-sol"
codex_effort = "medium"
owns = ["docs/design/**", "assets/**"]

[roles.developer]
title = "개발"
claude_model = "opus"
claude_effort = "xhigh"
codex_model = "gpt-6-astra"
codex_effort = "xhigh"
owns = ["src/**", "README.md", "docs/user/**", "docs/policy/**"]

[roles.tester]
title = "테스트"
claude_model = "sonnet"
claude_effort = "xhigh"
codex_model = "gpt-6.1-sol"
codex_effort = "high"
owns = ["tests/**", "docs/qa/**"]
